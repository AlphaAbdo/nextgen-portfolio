<div class="underwork-wrapper"
     #wrapper
     [class.impact]="isImpacting()"
     [class.visible]="isVisible()"
     [class.reduced-quality]="useReducedQuality()">

  <div class="content-area">
    <ng-content></ng-content>
  </div>

       [style.width.px]="indicatorSize()"
       [style.height.px]="indicatorSize()"

       (mouseleave)="showTooltip.set(false)">

    </div>

    <div class="impact-wave impact-wave-1"></div>
    <div class="impact-wave impact-wave-2"></div>

    <div class="dust-container">
      <span *ngFor="let i of activeDustParticles()"
            [class]="'dust dust-' + i"
            [style.--angle]="getRandomAngle(i) + 'deg'"
            [style.--distance]="getRandomDistance(i) + 'px'"></span>
    </div>

    <div class="fragments-container">
      <span *ngFor="let i of [1,2,3,4,5,6]"
            [class]="'fragment fragment-' + i">
        <svg viewBox="0 0 4 4" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="4" height="4" [attr.fill]="getFragmentColor(i)"/>
        </svg>
      </span>
    </div>

    <div class="spark-container">
      <span *ngFor="let i of activeSparks()"
            [class]="'spark spark-' + i"></span>
    </div>

    <svg class="cracks" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path class="crack crack-1" d="M 70 30 L 65 25 L 60 22 L 55 20"
            stroke="#333" stroke-width="1.5" fill="none"/>
      <path class="crack crack-2" d="M 70 30 L 75 28 L 78 25 L 82 24"
            stroke="#333" stroke-width="1" fill="none"/>
      <path class="crack crack-3" d="M 70 30 L 68 35 L 65 38 L 62 42"
            stroke="#333" stroke-width="1.2" fill="none"/>
      <path class="crack crack-4" d="M 70 30 L 73 34 L 76 37"
            stroke="#333" stroke-width="0.8" fill="none"/>
    </svg>

    <div class="tooltip" [class.visible]="showTooltip()">
      <span class="tooltip-text">
        <span class="tooltip-icon">⚠</span>
        Construction zone
      </span>
    </div>
  </div>
</div>
