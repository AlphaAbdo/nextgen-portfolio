<div class="loading-container" [ngClass]="containerClasses" role="status" aria-live="polite" [attr.aria-busy]="visible">
  <!-- Easter egg top message -->
  <div class="easter-top" *ngIf="showEasterEggs && visible && topMessage">{{ topMessage }}</div>

  <!-- Spinner -->
  <div class="loading-spinner" *ngIf="visible" [style.width]="spinnerSize" [style.height]="spinnerSize">
    <div class="spinner-ring"></div>
    <div class="spinner-ring"></div>
    <div class="spinner-ring"></div>
  </div>

  <!-- Loading content -->
  <div class="loading-content" *ngIf="visible">
    <p class="loading-text" [style.font-size]="textSize">
      {{ getCurrentMessage() }}
    </p>

    <!-- Retry button -->
    <button
      *ngIf="showRetry && error"
      (click)="onRetry()"
      class="retry-button"
      [disabled]="isRetrying"
      type="button"
      aria-label="Retry loading">
      <span class="retry-icon" [class.spinning]="isRetrying">↻</span>
      {{ getRetryMessage() }}
    </button>
  </div>
</div>
