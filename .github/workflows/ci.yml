name: CI/CD Pipeline

# Responsibilities:
# - This workflow is the main repository CI: lint, test, build (including frontend).
# - It runs on pushes to `main` and `develop` and on PRs to `main`.
# - Keep this workflow focused on verification. Production deployment is handled
#   by `.github/workflows/deploy-pages.yml` which only runs on `main`.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install

    - name: Bootstrap packages
      run: npm run bootstrap

    - name: Lint code
      run: npm run lint

    - name: Build frontend (explicit)
      run: npm run --prefix packages/frontend build:prod

    - name: Build packages
      run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: verify

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t nextgen-portfolio .

    - name: Test Docker image
      run: |
        docker run -d --name test-container -p 3000:3000 -p 5000:5000 nextgen-portfolio
        sleep 10
        curl -f http://localhost:3000/health
        docker stop test-container