name: Deploy Frontend to GitHub Pages

# Responsibilities:
# - Build the frontend artifact and deploy it to GitHub Pages.
# - Triggered only for `main` branch pushes/PRs and manually via workflow_dispatch.
# - Keep the heavy build and deploy steps isolated from the main CI matrix.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build and upload artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: packages/frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('packages/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install frontend dependencies
        run: npm ci
        working-directory: packages/frontend

      - name: Build frontend (production)
        run: npm run build:prod
        working-directory: packages/frontend

      - name: Find deploy directory
        id: find
        run: |
          NODE_PATH=./node_modules node ./scripts/find-deploy-dir.js packages/frontend/dist/portfolio-app > deploy_dir.txt
          echo "deploy_path=$(cat deploy_dir.txt)" >> $GITHUB_OUTPUT

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ${{ steps.find.outputs.deploy_path }}

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-and-upload
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
