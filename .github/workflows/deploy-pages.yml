name: Deploy Frontend to GitHub Pages (gh-pages push)

# Build the frontend (inside Docker to ensure Node 20.x) and push the built
# site to the `gh-pages` branch using peaceiris/actions-gh-pages@v3.
#
# This flow is a pragmatic fallback to the Pages API when artifact exchange
# or Pages API runs run into transient permission/handshake failures.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build frontend and push to gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend inside Docker (Node 20.19)
        run: |
          echo "Building frontend inside Docker (node:20.19)..."
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work/packages/frontend \
            node:20.19-bullseye sh -c "npm install --no-audit --no-fund && npm run build:prod"

      - name: Find deploy directory
        id: find
        run: |
          node ./scripts/find-deploy-dir.js packages/frontend/dist/portfolio-app > deploy_dir.txt
          echo "deploy_path=$(cat deploy_dir.txt)" >> $GITHUB_OUTPUT

      - name: Verify index.html exists
        run: |
          echo "Checking for index.html in ${{ steps.find.outputs.deploy_path }}"
          if [ ! -f "${{ steps.find.outputs.deploy_path }}/index.html" ]; then
            echo "ERROR: index.html not found in ${{ steps.find.outputs.deploy_path }}"
            ls -la "${{ steps.find.outputs.deploy_path }}"
            exit 2
          fi

      - name: Show built files (diagnostic)
        run: |
          echo "Publish directory: ${{ steps.find.outputs.deploy_path }}"
          echo "Absolute path on runner: $(realpath ${{ steps.find.outputs.deploy_path }} 2>/dev/null || echo 'N/A')"
          echo "Listing top-level files:" 
          ls -la "${{ steps.find.outputs.deploy_path }}" | sed -n '1,200p'

      - name: Deploy to gh-pages (peaceiris)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_PAGES_PAT }}
          publish_dir: ${{ steps.find.outputs.deploy_path }}
          publish_branch: gh-pages
          keep_files: false
          force_orphan: false
        env:
          TZ: UTC
