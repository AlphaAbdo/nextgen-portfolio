name: Frontend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend deps
        run: |
          cd packages/frontend
          npm ci
      - name: Build frontend
        run: |
          npm run --prefix packages/frontend build:prod
      - name: Run frontend tests
        run: |
          npm run --prefix packages/frontend test -- --watch=false --browsers=ChromeHeadless
